<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Dictionary App</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="app">
    <a href="index.html" class="back">← Back to Portfolio</a>
    <h1>Dictionary</h1>
    <form id="search-form">
      <label for="word-input" class="sr-only">Word to define</label>
      <input id="word-input" type="text" placeholder="Type a word, e.g. serendipity" autocomplete="off">
      <button type="submit">Search</button>
    </form>
    <p id="status" role="status"></p>
    <div id="result"></div>
  </main>
  <script src="script.js"></script>
</body>
</html>
